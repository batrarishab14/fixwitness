name: "fixwitness"
description: "Evidence that an AI fix or self-healing repair fixed the problem without changing your data."
author: "Rishab Batra"
branding:
  icon: "shield"
  color: "green"
inputs:
  path:
    description: "The file the fix changed, e.g. etl/clean.py (compared with the pull request's base commit)"
    default: ""
  sample:
    description: "Sample input CSV (found automatically when there is exactly one next to the script)"
    default: ""
  command:
    description: "Entry command when the fix spans several files, e.g. 'python3 etl/run.py {input} {output}'"
    default: ""
  base:
    description: "Git revision holding the original (default: the pull request's base commit, else HEAD)"
    default: ""
  config:
    description: "Path to a fixwitness.toml (optional; ./fixwitness.toml is used when nothing else is given)"
    default: ""
  min-confidence:
    description: "Fail the step if the confidence score (0-100) is below this"
    default: "0"
  python-version:
    description: "Python used to run fixwitness (3.11 or newer)"
    default: "3.12"
outputs:
  verdict:
    description: "PASS, FAIL or INCONCLUSIVE"
    value: ${{ steps.run.outputs.verdict }}
  confidence:
    description: "Confidence score 0-100"
    value: ${{ steps.run.outputs.confidence }}
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install fixwitness
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "$ACTION_PATH"
    - name: Run fixwitness
      id: run
      shell: bash
      env:
        FP_PATH: ${{ inputs.path }}
        FP_SAMPLE: ${{ inputs.sample }}
        FP_COMMAND: ${{ inputs.command }}
        FP_BASE: ${{ inputs.base }}
        FP_PR_BASE: ${{ github.event.pull_request.base.sha }}
        FP_CONFIG: ${{ inputs.config }}
        FP_MIN: ${{ inputs.min-confidence }}
      run: |
        set +e
        args=(check --out-dir fixwitness-report --min-confidence "$FP_MIN")
        [ -n "$FP_CONFIG" ] && args+=(--config "$FP_CONFIG")
        [ -n "$FP_PATH" ] && args+=("$FP_PATH")
        [ -n "$FP_SAMPLE" ] && args+=(--sample "$FP_SAMPLE")
        [ -n "$FP_COMMAND" ] && args+=(--command "$FP_COMMAND")
        base="$FP_BASE"
        [ -z "$base" ] && base="$FP_PR_BASE"
        [ -n "$base" ] && args+=(--base "$base")
        fixwitness "${args[@]}"
        code=$?
        if [ -f fixwitness-report/report.md ]; then
          cat fixwitness-report/report.md >> "$GITHUB_STEP_SUMMARY"
          python -c "import json; p = json.load(open('fixwitness-report/proof.json')); print('verdict=' + p['verdict']); print('confidence=' + str(p['confidence']['score']))" >> "$GITHUB_OUTPUT"
        fi
        exit $code
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fixwitness-proof
        path: fixwitness-report/
        if-no-files-found: ignore
