[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fixwitness"
version = "0.6.0.dev0"
description = "Evidence that an AI fix or self-healing repair fixed the problem without changing your data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Rishab Batra"}]
keywords = ["self-healing", "data-pipelines", "autofix", "security", "differential-testing", "mcp", "etl", "ai-agents",
            "dbt", "sql", "pandas", "polars", "pyspark", "parquet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
# Each is optional: fixwitness runs SQL on SQLite and checks CSV and JSON without any of them.
duckdb = ["duckdb"]
dbt = ["dbt-core", "dbt-duckdb"]     # dbt projects compiled by dbt itself
dialects = ["sqlglot"]               # Snowflake, BigQuery, Postgres, T-SQL ... translated for the check
pandas = ["pandas"]
polars = ["polars"]
pyspark = ["pyspark"]
parquet = ["pyarrow"]
all = ["duckdb", "dbt-core", "dbt-duckdb", "sqlglot", "pandas", "polars", "pyarrow"]

[project.urls]
Homepage = "https://github.com/batrarishab14/fixwitness"
Issues = "https://github.com/batrarishab14/fixwitness/issues"

[project.scripts]
fixwitness = "fixwitness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fixwitness = ["examples/*/*"]
