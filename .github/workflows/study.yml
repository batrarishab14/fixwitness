name: study
# The real-repository study (benchmark/realrepo/PROTOCOL.md): fixwitness on real bug fixes and real
# refactors from Fivetran's public dbt packages. Run by hand; results are saved to the
# study-results branch.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "candidate ids to run (comma-separated); empty = every in-scope candidate"
        required: false
        default: ""
      shards:
        description: "parallel jobs"
        required: false
        default: "20"
  push:
    branches: [study]
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.s.outputs.shards }}
      only: ${{ steps.s.outputs.only }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          # A pushed benchmark/realrepo/only.txt (one id per line) runs just those candidates.
          only="$ONLY"
          if [ -z "$only" ] && [ -f benchmark/realrepo/only.txt ]; then only=$(grep -v '^#' benchmark/realrepo/only.txt | paste -sd, -); fi
          n="${{ github.event.inputs.shards || '20' }}"
          if [ -n "$only" ]; then n=$(python3 -c "print(min(4, len('$only'.split(','))))"); fi
          echo "only=$only" >> "$GITHUB_OUTPUT"
          echo "shards=$(python3 -c "import json;print(json.dumps(list(range($n))))")" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixwitness, dbt-core and dbt-duckdb
        run: |
          python -m pip install --quiet -e . dbt-core dbt-duckdb sqlglot
          python - <<'PY' | tee versions.log
          import importlib.metadata as md, platform
          print("python", platform.python_version())
          for d in ("dbt-core", "dbt-duckdb", "duckdb", "sqlglot", "fixwitness"):
              print(d, md.version(d))
          PY
      - name: Run this shard
        env:
          ONLY: ${{ needs.plan.outputs.only }}
          SHARDS: ${{ needs.plan.outputs.shards }}
        run: |
          n=$(python3 -c "import json,os;print(len(json.loads(os.environ['SHARDS'])))")
          python benchmark/realrepo/run_study.py --shard ${{ matrix.shard }} --shards "$n" \
            --clones "$RUNNER_TEMP/clones" --out study-out --only "$ONLY" 2>&1 | tee study-out-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-${{ matrix.shard }}
          path: |
            versions.log
            study-out-*.log
            study-out/results_*.csv
            study-out/runs/*/log.txt
            study-out/runs/*/out/summary.json
            study-out/runs/*/out/report.md
            study-out/runs/*/out/**/proof.json
            study-out/issues/**
          if-no-files-found: ignore
  collect:
    needs: [plan, run]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Save to the study-results branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/out && cd /tmp/out
          cp -r "$GITHUB_WORKSPACE"/parts/* . 2>/dev/null || true
          python3 - <<'PY'
          import csv, glob
          rows = []
          for f in sorted(glob.glob("study-*/study-out/results_*.csv")):
              rows += list(csv.DictReader(open(f, encoding="utf-8")))
          if rows:
              w = csv.DictWriter(open("results.csv", "w", newline="", encoding="utf-8"), fieldnames=list(rows[0]),
                                 lineterminator="\n")
              w.writeheader(); w.writerows(sorted(rows, key=lambda r: r["id"]))
          print(len(rows), "rows")
          PY
          echo "${GITHUB_SHA} ${GITHUB_REF_NAME} $(date -u +%FT%TZ) only=${{ needs.plan.outputs.only }}" > commit.txt
          git init -q && git checkout -q -b study-results && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Study results for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" study-results
