name: sql
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  duckdb:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to save the logs to the ci-results branch on pushes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DuckDB
        run: |
          python -m pip install --quiet duckdb
          python -c "import duckdb; print('duckdb', duckdb.__version__)" | tee versions.log
      - name: SQL tests (SQLite and DuckDB)
        run: |
          set -o pipefail
          python -m unittest tests.test_fixwitness.SqlUnitTests tests.test_fixwitness.SqlModeTests -v 2>&1 | tee tests.log
      - name: SQL benchmark on DuckDB
        run: |
          set -o pipefail
          python benchmark/run_sql_bench.py --engine duckdb 2>&1 | tee bench.log
          cat benchmark/sql/RESULTS_duckdb.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-results
          path: |
            versions.log
            tests.log
            bench.log
            benchmark/sql/RESULTS_duckdb.md
            benchmark/sql/results_duckdb.csv
      - name: Save the logs to the ci-results branch
        if: always() && github.event_name == 'push'
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/out
          cp versions.log tests.log bench.log benchmark/sql/RESULTS_duckdb.md benchmark/sql/results_duckdb.csv /tmp/out/ 2>/dev/null || true
          echo "${GITHUB_SHA} ${GITHUB_REF_NAME} $(date -u +%FT%TZ)" > /tmp/out/commit.txt
          cd /tmp/out
          git init -q
          git checkout -q -b ci-results
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "SQL CI logs for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results
