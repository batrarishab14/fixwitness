name: debug
on:
  push:
    branches: [debug]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -e . dbt-core dbt-duckdb
      - run: bash debug.sh 2>&1 | tee debug.log
