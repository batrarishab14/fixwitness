# Publishes a release to PyPI, then lists it in the official MCP Registry.
#
# Runs when you publish a GitHub release, or by hand (Actions -> publish -> Run workflow) for an
# existing tag. No tokens are stored: PyPI uses "trusted publishing" and the MCP Registry uses
# GitHub OIDC.
#
# One-time setup:
#   1. pypi.org -> your account -> Publishing -> add a pending publisher (GitHub Actions):
#      PyPI project name "fixwitness", owner "batrarishab14", repository "fixwitness",
#      workflow "publish.yml", environment "pypi".
#   2. This repository -> Settings -> Environments -> New environment "pypi".
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.6.0"
        required: true
permissions:
  contents: read
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${VERSION}" = "${TAG}" || { echo "tag ${TAG} does not match version ${VERSION}"; exit 1; }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build
        run: |
          python -m pip install --quiet build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Wait for PyPI to serve the new version
        run: |
          for i in $(seq 1 30); do
            curl -fsS "https://pypi.org/pypi/fixwitness/${{ needs.pypi.outputs.version }}/json" > /dev/null && exit 0
            sleep 10
          done
          echo "PyPI does not show fixwitness ${{ needs.pypi.outputs.version }} yet"; exit 1
      - name: Set the version in server.json
        run: |
          jq --arg v "${{ needs.pypi.outputs.version }}" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          cat server.json
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
