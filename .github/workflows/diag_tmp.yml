name: diag-tmp
# Throwaway: why does jira@v1.10.3 kill the study runner? Not for merge.
on:
  push:
    branches: [diag-tmp]
jobs:
  jira:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: test}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      FIXWITNESS_STUDY_WAREHOUSE: postgres://ci@localhost:5432/test
      PGPASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --quiet -e . dbt-core dbt-postgres dbt-duckdb sqlglot "psycopg[binary]"
      - name: Run jira alone, memory-capped, with a monitor
        run: |
          free -m; df -h / "$RUNNER_TEMP" | cat; nproc
          ( while true; do
              echo "MON $(date +%T) mem=$(free -m | awk 'NR==2{print $3"/"$2"MB"}') disk=$(df -h / | awk 'NR==2{print $5}') tmp=$(du -sh "$RUNNER_TEMP" 2>/dev/null | cut -f1)"
              ps -eo rss,etime,args --sort=-rss | head -4 | awk 'NR>1{printf "MON   %6.0fMB %s %s\n",$1/1024,$2,substr($0,index($0,$3),110)}'
              for f in $(ls -t study-out/runs/*/log.txt 2>/dev/null | head -1); do echo "MON   log: $(tail -1 $f | cut -c1-150)"; done
              sleep 5; done ) &
          # cap at 5 GB so an out-of-memory error kills the study, not the runner
          sudo systemd-run --scope -q -p MemoryMax=5G -p MemorySwapMax=0 --uid=$(id -u) --gid=$(id -g) -- \
            env PATH="$PATH" HOME="$HOME" FIXWITNESS_STUDY_WAREHOUSE="$FIXWITNESS_STUDY_WAREHOUSE" PGPASSWORD=ci \
            "$(which python)" benchmark/realrepo/run_study.py --shard 0 --shards 1 --clones "$RUNNER_TEMP/clones" \
            --out study-out --only jira@v1.10.3 2>&1 | tee jira.log; echo "EXIT ${PIPESTATUS[0]}"
          dmesg 2>/dev/null | grep -i -E "oom|killed process" | tail -5 || sudo dmesg | grep -i -E "oom|killed process" | tail -5
      - name: Show candidate log
        if: always()
        run: |
          for f in study-out/runs/*/log.txt study-out/runs/*/error.txt; do echo "== $f"; tail -60 "$f"; done 2>/dev/null
          cat study-out/results_*.csv 2>/dev/null
