name: Something doesn't work
description: An error, a crash, a confusing message or a setup problem.
body:
  - type: textarea
    id: what
    attributes:
      label: What you ran and what happened
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: fixwitness version and Python version
      placeholder: "fixwitness 0.6.0, Python 3.12"
